name: Build and Release

# Trigger on:
#   1. Push of any tag matching v*  -> create GitHub Release with source ZIP
#   2. Manual dispatch from the Actions tab -> build only (upload artifact)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed for softprops/release-action

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can include git info in the zip

      - name: Set up JDK 1.8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          java-package: jdk

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-1.12.2-gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            forge-1.12.2-gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---- Optional ForgeGradle build attempt ----
      # The Java sources are JD-Core 1.1.3 decompiled output and have many
      # artifacts (stripped imports, mangled enums, SRG names that the
      # snapshot_20171003-1.12 mappings don't always resolve at compile time).
      # We attempt the Gradle build, but continue-on-error so the release
      # is still produced with the source ZIP if compilation fails.
      - name: Try ForgeGradle build (best-effort)
        id: try_gradle
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace build reobfJar 2>&1 | tee gradle-build.log
          exit 0

      - name: Collect build artifacts (if any)
        id: collect
        run: |
          set -e
          mkdir -p dist
          # Copy any compiled JAR(s)
          JAR_FOUND=0
          if [ -d build/libs ]; then
            for f in build/libs/*.jar; do
              [ -e "$f" ] || continue
              cp "$f" dist/
              JAR_FOUND=1
            done
          fi

          # Build a source ZIP for end users who want to compile themselves
          # (excludes build/, .gradle/, .git/, etc.)
          (cd "$GITHUB_WORKSPACE" \
            && zip -r -q "$GITHUB_WORKSPACE/dist/mcheli-1.1.4-src.zip" . \
              -x "build/*" -x ".gradle/*" -x "run/*" -x "out/*" \
              -x ".git/*" -x "*.iml" -x ".idea/*" \
              -x "dist/*" -x "gradle-build.log")

          # Save gradle build log for transparency
          [ -f gradle-build.log ] && cp gradle-build.log dist/ || true

          ls -la dist/
          echo "jar_found=$JAR_FOUND" >> $GITHUB_OUTPUT

      - name: Locate mod version
        id: locate_version
        run: |
          MOD_VERSION=$(grep -E "^version = " build.gradle | head -n 1 | sed -E 's/^version = '"'"'([^'"'"']+)'"'"'.*/\1/')
          MC_VERSION="1.12.2"
          FORGE_VERSION="1.12.2-14.23.5.2860"
          echo "mod_version=$MOD_VERSION"     >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION"      >> $GITHUB_OUTPUT
          echo "forge_version=$FORGE_VERSION">> $GITHUB_OUTPUT

      - name: Upload build artifacts (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mcheli-build-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # ---- Release on tag push ----
      - name: Create GitHub Release with all artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MC-Heli Overdrive ${{ github.ref_name }} (MC 1.12.2)
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # MC Helicopter Overdrive - F-22 / F-35 Edition

            Mod version: **${{ steps.locate_version.outputs.mod_version }}**
            Minecraft version: **${{ steps.locate_version.outputs.mc_version }}**
            Forge version: **${{ steps.locate_version.outputs.forge_version }}**

            ## Contents
            - **F-22A Raptor** (with default + ISAF skins)
            - **F-35A Lightning II**
            - All weapons used by these aircraft (M61A2, AIM-9X, AIM-120, GAU-22/A, GBU-39 SDB, GBU-53 SDB II, B61 nuclear, targeting pods, UHF radar)
            - All common mod utilities (wrench, fuel, container, parachute, drafting table, UAV station, range finder, FIM-92, FGM-148)
            - HUD, sounds, recipes, language files, shaders

            All other aircraft, tanks, helicopters, ships, and stationary weapons have been removed.

            ## Download contents

            - **`mcheli-${{ steps.locate_version.outputs.mod_version }}-src.zip`** — Full mod source tree (cleaned, ForgeGradle-ready). Includes `build.gradle` + `gradlew` so you can compile with `./gradlew build` on your own machine using JDK 8.
            - **`gradle-build.log`** — Output of the ForgeGradle build attempt on GitHub Actions (the build may fail on the public CI because the Java sources are JD-Core decompiled output and contain some unresolved SRG-name references; the log is included for transparency so you can see which fixes are still needed).
            - **Compiled JAR (if present)** — If the build did succeed on GitHub's CI, the compiled `mcheli-1.1.4.jar` will be attached here too.

            ## How to compile on your own machine

            1. Install **JDK 8** (required for ForgeGradle 3.x with Minecraft 1.12.2; JDK 11+ does NOT work).
            2. Unzip `mcheli-1.1.4-src.zip` to a folder.
            3. Run `./gradlew build` — this downloads Forge 1.12.2-14.23.5.2860, MCP mappings `snapshot_20171003-1.12`, then compiles and reobfuscates the mod.
            4. The compiled mod JAR is in `build/libs/mcheli-1.1.4.jar`.

            ## Installation in Minecraft

            1. Install Minecraft Forge `${{ steps.locate_version.outputs.forge_version }}` (you can get it from <https://files.minecraftforge.net/>).
            2. Drop the compiled `mcheli-*.jar` into your `.minecraft/mods/` folder.
            3. Launch Minecraft `${{ steps.locate_version.outputs.mc_version }}` with the Forge profile.

            ## Important note about decompiled sources

            The Java sources in this repo were extracted from the original
            `mchelionukebeta.jar` using **JD-Core 1.1.3**. JD-Core strips
            many `import` statements and sometimes misplaces static field
            declarations inside enums. We have already restored missing
            imports across the 17 most-affected files and fixed the two
            enum files (`LegacyModelLoader.java`, `EnumDirection8.java`),
            but a full compile still needs additional SRG-name remapping
            work in a small number of wrapper/util classes. The build log
            is included for transparency.

          files: |
            dist/*.zip
            dist/*.jar
            dist/gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}
